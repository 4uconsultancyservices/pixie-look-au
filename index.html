addFile(kotlinSrc+"/utils/PIDController.kt", `package com.styleai.app.utils
import kotlin.math.max

class PIDController(
    private val name: String,
    private var kp: Float = 0.5f, private var ki: Float = 0.01f, private var kd: Float = 0.1f,
    private val outputMin: Float = -1f, private val outputMax: Float = 1f
) {
    private var integral = 0f; private var prevError = 0f; private var lastTime = System.nanoTime()

    fun compute(error: Float): Float {
        val now = System.nanoTime(); val dt = max((now - lastTime) / 1e9f, 0.001f); lastTime = now
        val p = kp * error
        integral = (integral + error * dt).coerceIn(outputMin / max(ki, 0.001f), outputMax / max(ki, 0.001f))
        val i = ki * integral
        val d = kd * ((error - prevError) / dt); prevError = error
        return (p + i + d).coerceIn(outputMin, outputMax)
    }
    fun reset() { integral = 0f; prevError = 0f; lastTime = System.nanoTime() }
    fun setGains(kp: Float, ki: Float, kd: Float) { this.kp = kp; this.ki = ki; this.kd = kd }
}

class SmoothTracker(private var smoothing: Float = 0.5f) {
    private var pidX = PIDController("X", smoothing, 0.005f, 0.08f, -0.5f, 0.5f)
    private var pidY = PIDController("Y", smoothing, 0.005f, 0.08f, -0.5f, 0.5f)
    private var pidZ = PIDController("Z", smoothing * 0.6f, 0.003f, 0.05f, 0.5f, 3f)
    private var cx = 0.5f; private var cy = 0.5f; private var cz = 1f

    fun update(tx: Float, ty: Float, ts: Float): TrackingOutput {
        cx = (cx + pidX.compute(tx - cx) * 0.3f).coerceIn(0f, 1f)
        cy = (cy + pidY.compute(ty - cy) * 0.3f).coerceIn(0f, 1f)
        cz = (1f + pidZ.compute(0.25f - ts)).coerceIn(1f, 3f)
        return TrackingOutput(cx, cy, cz)
    }
    fun reset() { pidX.reset(); pidY.reset(); pidZ.reset(); cx = 0.5f; cy = 0.5f; cz = 1f }
    fun setSmoothing(v: Float) { smoothing = v; pidX.setGains(v, 0.005f, 0.08f); pidY.setGains(v, 0.005f, 0.08f); pidZ.setGains(v*0.6f, 0.003f, 0.05f) }
    data class TrackingOutput(val x: Float, val y: Float, val zoom: Float)
}`);

addFile(kotlinSrc+"/utils/PerformanceMonitor.kt", `package com.styleai.app.utils
import android.content.Context
import android.os.Debug
import java.util.concurrent.atomic.AtomicLong

class PerformanceMonitor(private val ctx: Context) {
    private val frameCount = AtomicLong(0)
    private var lastTime = System.currentTimeMillis(); private var currentFps = 0
    private var totalMs = 0L; private var count = 0L; private var avgLatency = 0f

    fun onFrameProcessed(ms: Long = 0) {
        frameCount.incrementAndGet()
        if (ms > 0) { totalMs += ms; count++; avgLatency = totalMs.toFloat() / count }
        val now = System.currentTimeMillis()
        if (now - lastTime >= 1000) { currentFps = (frameCount.get() * 1000 / (now - lastTime)).toInt(); frameCount.set(0); lastTime = now }
    }
    fun getFps() = currentFps
    fun getMemoryMB() = (Runtime.getRuntime().let { it.totalMemory() - it.freeMemory() }) / (1024f * 1024f)
    fun isMemoryPressureHigh() = Runtime.getRuntime().let { (it.totalMemory() - it.freeMemory()).toFloat() / it.maxMemory() > 0.85f }
    fun reset() { frameCount.set(0); totalMs = 0; count = 0; avgLatency = 0f; currentFps = 0; lastTime = System.currentTimeMillis() }
}`);

addFile(kotlinSrc+"/utils/LifecycleAwareManager.kt", `package com.styleai.app.utils
import androidx.lifecycle.*

class LifecycleAwareManager : DefaultLifecycleObserver {
    private val cleanup = mutableListOf<() -> Unit>()
    private val pause = mutableListOf<() -> Unit>()
    private val resume = mutableListOf<() -> Unit>()
    fun registerCleanup(a: () -> Unit) { cleanup.add(a) }
    fun registerPause(a: () -> Unit) { pause.add(a) }
    fun registerResume(a: () -> Unit) { resume.add(a) }
    override fun onResume(o: LifecycleOwner) { resume.forEach { it() } }
    override fun onPause(o: LifecycleOwner) { pause.forEach { it() } }
    override fun onDestroy(o: LifecycleOwner) { cleanup.forEach { try { it() } catch (_: Exception) {} }; cleanup.clear() }
}`);

class SettingsDataStore(private val ctx: Context) {
    companion object {
        private val Context.ds by preferencesDataStore("settings")
        private val K_TRACK = booleanPreferencesKey("tracking"); private val K_ZOOM = booleanPreferencesKey("zoom")
        private val K_SMOOTH = floatPreferencesKey("smooth"); private val K_SENS = floatPreferencesKey("sens")
        private val K_OVERLAY = booleanPreferencesKey("overlay"); private val K_LANDMARKS = booleanPreferencesKey("landmarks")
        private val K_MIRROR = booleanPreferencesKey("mirror"); private val K_QUALITY = stringPreferencesKey("quality")
    }
    val settings: Flow<AppSettings> = ctx.ds.data.catch { emit(emptyPreferences()) }.map { p ->
        AppSettings(p[K_TRACK] ?: true, p[K_ZOOM] ?: true, p[K_SENS] ?: 0.5f, p[K_SMOOTH] ?: 0.5f,
            p[K_OVERLAY] ?: true, p[K_LANDMARKS] ?: true, p[K_MIRROR] ?: true, p[K_QUALITY] ?: "1080p")
    }
    suspend fun save(s: AppSettings) { ctx.ds.edit { it[K_TRACK]=s.trackingEnabled; it[K_ZOOM]=s.autoZoomEnabled; it[K_SENS]=s.zoomSensitivity; it[K_SMOOTH]=s.trackingSmoothing; it[K_OVERLAY]=s.showOverlay; it[K_LANDMARKS]=s.showLandmarks; it[K_MIRROR]=s.cameraMirror; it[K_QUALITY]=s.videoQuality } }
    suspend fun reset() { save(AppSettings()) }
}`);

    private val usbMgr by lazy { ctx.getSystemService(Context.USB_SERVICE) as? UsbManager }
    private var device: UsbDevice? = null; private var conn: UsbDeviceConnection? = null; private var uvc: UvcCameraController? = null
    private val receiver = object : BroadcastReceiver() {
        override fun onReceive(c: Context, i: Intent) {
            when (i.action) {
                ACTION -> { val d = if (Build.VERSION.SDK_INT >= 33) i.getParcelableExtra(UsbManager.EXTRA_DEVICE, UsbDevice::class.java) else @Suppress("DEPRECATION") i.getParcelableExtra(UsbManager.EXTRA_DEVICE)
                    if (i.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false) && d != null) connectDevice(d) else updateState(error = "USB permission denied") }
                UsbManager.ACTION_USB_DEVICE_DETACHED -> { val d = if (Build.VERSION.SDK_INT >= 33) i.getParcelableExtra(UsbDevice::class.java) else @Suppress("DEPRECATION") i.getParcelableExtra(UsbManager.EXTRA_DEVICE); if (d?.deviceId == device?.deviceId) disconnect() }
            }
        }
    }
    fun initialize() { ctx.registerReceiver(receiver, IntentFilter().apply { addAction(ACTION); addAction(UsbManager.ACTION_USB_DEVICE_DETACHED) }); scanForDevices() }
    fun scanForDevices(): List<UsbDevice> {
        val m = usbMgr ?: return emptyList()
        val devs = m.deviceList.values.filter { d -> d.deviceClass == 0x0E || (0 until d.interfaceCount).any { d.getInterface(it).interfaceClass == 0x0E } }
        AppLogger.i(TAG, "Found \${devs.size} UVC devices")
        updateState(devices = devs); if (devs.isNotEmpty() && device == null) requestPermission(devs.first())
        return devs
    }
    fun requestPermission(d: UsbDevice) { val f = if (Build.VERSION.SDK_INT >= 33) PendingIntent.FLAG_MUTABLE else 0; usbMgr?.requestPermission(d, PendingIntent.getBroadcast(ctx, 0, Intent(ACTION), f)) }
    private fun connectDevice(d: UsbDevice) {
        val c = usbMgr?.openDevice(d) ?: run { updateState(error = "Failed to open"); return }
        device = d; conn = c; uvc = UvcCameraController(d, c).also { it.initialize() }
        updateState(active = true, ready = true, name = d.deviceName)
    }
    fun startPreview(surface: Surface, w: Int = 1280, h: Int = 720) { uvc?.setPreviewSize(w, h); uvc?.startPreview(surface) { f, pw, ph -> onFrame?.invoke(f, pw, ph); updateState(res = Pair(pw, ph), fps = 30) } }
    fun stopPreview() { uvc?.stopPreview() }
    fun disconnect() { uvc?.release(); uvc = null; conn?.close(); conn = null; device = null; updateState() }
    fun release() { disconnect(); try { ctx.unregisterReceiver(receiver) } catch (_: Exception) {} }
    private fun updateState(active: Boolean = false, ready: Boolean = false, error: String? = null, name: String? = null, res: Pair<Int,Int>? = null, fps: Int = 0, devices: List<UsbDevice>? = null) {
        _state.value = CameraStreamState(active, ready, error, name, res, fps, devices ?: _state.value.devices)
    }
    data class CameraStreamState(val active: Boolean = false, val ready: Boolean = false, val error: String? = null, val name: String? = null, val res: Pair<Int,Int>? = null, val fps: Int = 0, val devices: List<UsbDevice> = emptyList())
}`);

addFile(kotlinSrc+"/camera/usb/UvcCameraController.kt", `package com.styleai.app.camera.usb
import android.hardware.usb.*
import android.view.Surface
import com.styleai.app.utils.AppLogger

class UvcCameraController(private val device: UsbDevice, private val conn: UsbDeviceConnection) {
    companion object { private const val TAG = "UvcCtrl" }
    private var streamIface: UsbInterface? = null; private var streamEp: UsbEndpoint? = null
    private var controlIface: UsbInterface? = null; private var initialized = false; private var streaming = false
    private var thread: Thread? = null; private var w = 1280; private var h = 720

    fun initialize() {
        for (i in 0 until device.interfaceCount) {
            val iface = device.getInterface(i)
            if (iface.interfaceClass == UsbConstants.USB_CLASS_VIDEO && iface.interfaceSubclass == 0x01.toByte()) controlIface = iface
            if (iface.interfaceClass == UsbConstants.USB_CLASS_VIDEO && iface.interfaceSubclass == 0x02.toByte()) streamIface = iface
        }
        streamIface?.let { si -> for (j in 0 until si.endpointCount) { val ep = si.getEndpoint(j); if (ep.direction == UsbConstants.USB_DIR_IN) { streamEp = ep; break } } }
        if (streamEp != null) { conn.claimInterface(controlIface, true); conn.claimInterface(streamIface, true); initialized = true; AppLogger.i(TAG, "UVC initialized") }
    }
    fun setPreviewSize(w: Int, h: Int) { this.w = w; this.h = h }
    fun startPreview(surface: Surface, cb: (ByteArray, Int, Int) -> Unit) {
        if (!initialized) return; streaming = true
        thread = Thread({
            val ep = streamEp ?: return@Thread; val buf = ByteArray(w * h * 2)
            while (streaming && !Thread.currentThread().isInterrupted) {
                try { val n = conn.bulkTransfer(ep, buf, buf.size, 1000); if (n > 0) cb(buf.copyOf(n), w, h) } catch (e: Exception) { break }
            }
        }, "UVC").also { it.priority = Thread.MAX_PRIORITY; it.start() }
    }
    fun stopPreview() { streaming = false; thread?.interrupt(); thread = null }
    fun release() { stopPreview(); streamIface?.let { conn.releaseInterface(it) }; controlIface?.let { conn.releaseInterface(it) }; initialized = false }
}`);

import android.content.Context
import android.util.Size
import androidx.camera.core.*
import androidx.camera.lifecycle.ProcessCameraProvider
import androidx.camera.view.PreviewView
import androidx.core.content.ContextCompat
import androidx.lifecycle.LifecycleOwner
import com.styleai.app.utils.AppLogger
import java.util.concurrent.*

class CameraXManager(private val ctx: Context) {
    companion object { private const val TAG = "CameraX" }
    private var provider: ProcessCameraProvider? = null; private var camera: Camera? = null
    private val executor: ExecutorService = Executors.newSingleThreadExecutor()
    var onFrame: ((ByteArray, Int, Int) -> Unit)? = null; var front = true

    fun init(owner: LifecycleOwner, view: PreviewView, onReady: (() -> Unit)? = null) {
        val f = ProcessCameraProvider.getInstance(ctx)
        f.addListener({ provider = f.get(); bind(owner, view); onReady?.invoke() }, ContextCompat.getMainExecutor(ctx))
    }
    private fun bind(owner: LifecycleOwner, view: PreviewView) {
        val p = provider ?: return; p.unbindAll()
        val sel = if (front) CameraSelector.DEFAULT_FRONT_CAMERA else CameraSelector.DEFAULT_BACK_CAMERA
        val prev = Preview.Builder().setTargetResolution(Size(1280, 720)).build().also { it.setSurfaceProvider(view.surfaceProvider) }
        val anal = ImageAnalysis.Builder().setTargetResolution(Size(1280, 720)).setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST).build()
        anal.setAnalyzer(executor) { ip ->
            val yb = ip.planes[0].buffer; val vb = ip.planes[2].buffer; val ub = ip.planes[1].buffer
            val nv21 = ByteArray(yb.remaining() + vb.remaining() + ub.remaining()); yb.get(nv21, 0, yb.remaining())
            for (i in 0 until vb.remaining()) { nv21[yb.remaining() + i * 2] = vb.get(i); nv21[yb.remaining() + i * 2 + 1] = ub.get(i) }
            onFrame?.invoke(nv21, ip.width, ip.height); ip.close()
        }
        camera = p.bindToLifecycle(owner, sel, prev, anal)
    }
    fun switch(owner: LifecycleOwner, view: PreviewView) { front = !front; bind(owner, view) }
    fun release() { provider?.unbindAll(); executor.shutdown() }
}`);

addFile(kotlinSrc+"/tracking/FaceTracker.kt", `package com.styleai.app.tracking
import android.content.Context; import android.graphics.Bitmap
import com.google.mediapipe.framework.image.BitmapImageBuilder
import com.google.mediapipe.tasks.core.*; import com.google.mediapipe.tasks.vision.facedetector.*
import com.styleai.app.data.model.*; import com.styleai.app.utils.*; import kotlinx.coroutines.flow.*

class FaceTracker(private val ctx: Context) {
    companion object { private const val TAG = "FaceTracker"; private const val MODEL = "blaze_face_short_range.tflite" }
    private var detector: FaceDetector? = null; private val smooth = SmoothTracker(0.5f)
    private val _result = MutableStateFlow(TrackingResult()); val result: StateFlow<TrackingResult> = _result.asStateFlow()
    private var count = 0L; private var inited = false

    fun init(ready: (() -> Unit)? = null) {
        try {
            val base = BaseOptions.builder().setModelAssetPath(MODEL).setDelegate(Delegate.GPU).build()
            detector = FaceDetector.createFromOptions(ctx, FaceDetector.FaceDetectorOptions.builder().setBaseOptions(base)
                .setRunningMode(com.google.mediapipe.tasks.vision.core.RunningMode.VIDEO)
                .setMinDetectionConfidence(0.5f).build())
            inited = true; AppLogger.i(TAG, "Face detector ready (GPU)"); ready?.invoke()
        } catch (e: Exception) {
            try { val base = BaseOptions.builder().setModelAssetPath(MODEL).setDelegate(Delegate.CPU).build()
                detector = FaceDetector.createFromOptions(ctx, FaceDetector.FaceDetectorOptions.builder().setBaseOptions(base)
                    .setRunningMode(com.google.mediapipe.tasks.vision.core.RunningMode.VIDEO).setMinDetectionConfidence(0.5f).build())
                inited = true; AppLogger.i(TAG, "Face detector ready (CPU)"); ready?.invoke()
            } catch (e2: Exception) { AppLogger.e(TAG, "Init failed", e2) }
        }
    }
    fun process(bmp: Bitmap, ts: Long): TrackingResult {
        if (!inited || detector == null) return TrackingResult(trackingMode = TrackingMode.NONE)
        try {
            val r = detector!!.detectForVideo(BitmapImageBuilder(bmp).build(), ts); count++
            var face: FaceDetection? = null; var conf = 0f
            if (r.detections().isNotEmpty) {
                val d = r.detections()[0]; val b = d.boundingBox()
                face = FaceDetection(b.left/bmp.width.toFloat(), b.top/bmp.height.toFloat(), b.width()/bmp.width.toFloat(), b.height()/bmp.height.toFloat())
                conf = d.categories().firstOrNull()?.score() ?: 0f
            }
            val s = if (face != null) smooth.update(face.x+face.width/2, face.y+face.height/2, maxOf(face.width, face.height)) else smooth.update(0.5f, 0.5f, 0.25f)
            val result = TrackingResult(face, confidence = conf, trackingMode = if (face != null) TrackingMode.FACE else TrackingMode.NONE)
            _result.value = result; return result
        } catch (e: Exception) { AppLogger.e(TAG, "Process error", e); return _result.value }
    }
    fun setSmoothing(v: Float) { smooth.setSmoothing(v) }
    fun reset() { smooth.reset(); count = 0; _result.value = TrackingResult() }
    fun release() { detector?.close(); detector = null; inited = false }
    fun getCount() = count
}`);

addFile(kotlinSrc+"/tracking/BodyTracker.kt", `package com.styleai.app.tracking
import android.content.Context; import android.graphics.Bitmap
import com.styleai.app.data.model.BodyDetection; import com.styleai.app.utils.AppLogger
import org.tensorflow.lite.Interpreter; import org.tensorflow.lite.gpu.GpuDelegate
import java.io.FileInputStream; import java.nio.*; import java.nio.channels.FileChannel

class BodyTracker(private val ctx: Context) {
    companion object { private const val TAG = "BodyTracker"; private const val MODEL = "yolov5n_int8.tflite"; private const val SIZE = 320 }
    private var interp: Interpreter? = null; private var gpu: GpuDelegate? = null; private var inited = false

    fun init(ready: (() -> Unit)? = null) {
        try {
            val model = ctx.assets.openFd(MODEL).let { FileInputStream(it.fileDescriptor).channel.map(FileChannel.MapMode.READ_ONLY, it.startOffset, it.declaredLength) }
            try { gpu = GpuDelegate(); interp = Interpreter(model, Interpreter.Options().apply { addDelegate(gpu); setNumThreads(4) }); AppLogger.i(TAG, "YOLO GPU ready") }
            catch (e: Exception) { interp = Interpreter(model, Interpreter.Options().apply { setNumThreads(4) }); AppLogger.i(TAG, "YOLO CPU ready") }
            inited = true; ready?.invoke()
        } catch (e: Exception) { AppLogger.e(TAG, "Init failed", e) }
    }
    fun process(bmp: Bitmap): BodyDetection? {
        if (!inited || interp == null) return null
        try {
            val r = Bitmap.createScaledBitmap(bmp, SIZE, SIZE, true)
            val buf = ByteBuffer.allocateDirect(SIZE * SIZE * 3 * 4).order(ByteOrder.nativeOrder())
            val px = IntArray(SIZE * SIZE); r.getPixels(px, 0, SIZE, 0, 0, SIZE, SIZE)
            for (p in px) { buf.putFloat(((p shr 16) and 0xFF) / 255f); buf.putFloat(((p shr 8) and 0xFF) / 255f); buf.putFloat((p and 0xFF) / 255f) }
            buf.rewind()
            val out = Array(1) { Array(25200) { FloatArray(6) } }; interp!!.run(buf, out)
            var best: BodyDetection? = null; var bestScore = 0f
            for (d in out[0]) { val sig = (1f / (1 + Math.exp(-d[4].toDouble()))).toFloat(); if (sig > 0.4f && d[5].toInt() == 0 && sig > bestScore) { bestScore = sig; best = BodyDetection((d[0]/SIZE - d[2]/SIZE/2).coerceIn(0f,1f), (d[1]/SIZE - d[3]/SIZE/2).coerceIn(0f,1f), (d[2]/SIZE).coerceIn(0f,1f), (d[3]/SIZE).coerceIn(0f,1f), sig) } }
            return best
        } catch (e: Exception) { AppLogger.e(TAG, "Process error", e); return null }
    }
    fun release() { interp?.close(); gpu?.close(); interp = null; inited = false }
}`);

addFile(kotlinSrc+"/tracking/FrameProcessor.kt", `package com.styleai.app.tracking
import android.graphics.*; import com.styleai.app.data.model.*; import com.styleai.app.utils.*
import kotlinx.coroutines.*; import java.io.ByteArrayOutputStream; import java.util.concurrent.atomic.AtomicBoolean

class FrameProcessor(private val face: FaceTracker, private val body: BodyTracker, private val smooth: SmoothTracker) {
    companion object { private const val TAG = "FrameProc"; private const val SKIP = 2 }
    private val scope = CoroutineScope(Dispatchers.Default + SupervisorJob())
    private val busy = AtomicBoolean(false); private var frame = 0L; private var skipCt = 0; private var lastTime = 0L
    private var callback: ((TrackingResult, SmoothTracker.TrackingOutput) -> Unit)? = null

    fun setCallback(cb: (TrackingResult, SmoothTracker.TrackingOutput) -> Unit) { callback = cb }

    fun processFrame(yuv: ByteArray, w: Int, h: Int, rot: Int = 0, mirror: Boolean = true) {
        skipCt++; if (skipCt <= SKIP) return; skipCt = 0
        val now = System.nanoTime(); if ((now - lastTime) / 1e6 < 66) return; lastTime = now
        if (!busy.compareAndSet(false, true)) return
        scope.launch {
            try {
                val bmp = yuvToBitmap(yuv, w, h, rot, mirror) ?: run { busy.set(false); return@launch }; frame++
                val fr = face.process(bmp, System.currentTimeMillis())
                var res = fr
                if (fr.face == null && fr.confidence < 0.3f) { val bd = body.process(bmp); if (bd != null) res = res.copy(body = bd, trackingMode = TrackingMode.BODY) }
                val s = if (res.face != null) smooth.update(res.face.x+res.face.width/2, res.face.y+res.face.height/2, maxOf(res.face.width, res.face.height))
                    else if (res.body != null) smooth.update(res.body.x+res.body.width/2, res.body.y+res.body.height/2, maxOf(res.body.width, res.body.height))
                    else smooth.update(0.5f, 0.5f, 0.25f)
                bmp.recycle()
                withContext(Dispatchers.Main) { callback?.invoke(res, s) }
            } catch (e: Exception) { AppLogger.e(TAG, "Error", e) } finally { busy.set(false) }
        }
    }
    private fun yuvToBitmap(yuv: ByteArray, w: Int, h: Int, rot: Int, mirror: Boolean): Bitmap? {
        return try {
            val out = ByteArrayOutputStream(); YuvImage(yuv, ImageFormat.NV21, w, h, null).compressToJpeg(Rect(0, 0, w, h), 70, out)
            var bmp = BitmapFactory.decodeByteArray(out.toByteArray(), 0, out.size())
            if (rot != 0 || mirror) { val m = Matrix(); if (rot != 0) m.postRotate(rot.toFloat()); if (mirror) m.postScale(-1f, 1f, bmp.width/2f, bmp.height/2f); bmp = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true) }
            bmp
        } catch (e: Exception) { null }
    }
    fun getFrameCount() = frame
    fun reset() { smooth.reset(); face.reset(); frame = 0; skipCt = 0 }
    fun release() { scope.cancel() }
}`);

addFile(kotlinSrc+"/ui/tutorials/TutorialAdapter.kt", `package com.styleai.app.ui.tutorials
import android.view.*; import androidx.recyclerview.widget.*; import com.styleai.app.R; import com.styleai.app.data.model.Tutorial; import com.styleai.app.databinding.ItemTutorialBinding

class TutorialAdapter(private val onClick: (Tutorial) -> Unit) : ListAdapter<Tutorial, TutorialAdapter.VH>(object : DiffUtil.ItemCallback<Tutorial>() {
    override fun areItemsTheSame(a: Tutorial, b: Tutorial) = a.id == b.id; override fun areContentsTheSame(a: Tutorial, b: Tutorial) = a == b
}) {
    override fun onCreateViewHolder(p: ViewGroup, vt: Int) = VH(ItemTutorialBinding.inflate(LayoutInflater.from(p.context), p, false))
    override fun onBindViewHolder(h: VH, pos: Int) { h.bind(getItem(pos)) }
    inner class VH(private val b: ItemTutorialBinding) : RecyclerView.ViewHolder(b.root) {
        fun bind(t: Tutorial) {
            b.tvTitle.text = t.title; b.tvDescription.text = t.description; b.tvDuration.text = t.duration
            b.tvCategory.text = t.category; b.tvDifficulty.text = t.difficulty
            b.tvDifficulty.setBackgroundResource(when(t.difficulty){"Beginner"->R.drawable.badge_beginner;"Intermediate"->R.drawable.badge_intermediate;else->R.drawable.badge_advanced})
            b.root.setOnClickListener { onClick(t) }
        }
    }
}`);

addFile(kotlinSrc+"/ui/tutorial/TutorialFragment.kt", `package com.styleai.app.ui.tutorial
import android.net.Uri; import android.os.Bundle; import android.view.*; import androidx.fragment.app.Fragment; import androidx.fragment.app.activityViewModels
import androidx.lifecycle.lifecycleScope; import androidx.media3.common.*; import androidx.media3.exoplayer.ExoPlayer; import androidx.media3.ui.PlayerView
import androidx.navigation.fragment.findNavController; import com.styleai.app.R; import com.styleai.app.databinding.FragmentTutorialBinding; import com.styleai.app.ui.main.MainViewModel; import kotlinx.coroutines.*

class TutorialFragment : Fragment() {
    private var _b: FragmentTutorialBinding? = null; private val b get() = _b!!; private val vm: MainViewModel by activityViewModels()
    private var player: ExoPlayer? = null; private var stepIdx = 0
    override fun onCreateView(i: LayoutInflater, c: ViewGroup?, s: Bundle?): View { _b = FragmentTutorialBinding.inflate(i, c, false); return b.root }
    override fun onViewCreated(v: View, s: Bundle?) {
        super.onViewCreated(v, s)
        b.btnBack.setOnClickListener { vm.clearTutorial(); vm.stopCamera(); findNavController().popBackStack() }
        b.btnToggleTracking.setOnClickListener { vm.toggleTracking() }; b.btnToggleZoom.setOnClickListener { vm.toggleZoom() }
        b.btnSettings.setOnClickListener { findNavController().navigate(R.id.action_tutorial_to_settings) }
        // Video
        player = ExoPlayer.Builder(requireContext()).build().apply { repeatMode = Player.REPEAT_MODE_ALL; playWhenReady = true }
        b.playerView.player = player; b.playerView.controllerShowTimeoutMs = 3000
        vm.selectedTutorial.observe(viewLifecycleOwner) { t -> t?.let {
            try { player?.setMediaItem(MediaItem.fromUri(Uri.parse("android.resource://\${requireContext().packageName}/\${R.raw.tutorial_demo}"))); player?.prepare() } catch (_: Exception) {}
            val steps = it.steps.mapIndexed { i, st -> "\${i+1}. \${st.title} (\${st.timestampSeconds}s)" }.joinToString("\\n"); b.tvStepsList.text = steps
        }}
        b.btnPlayPause.setOnClickListener { player?.let { p -> if (p.isPlaying) { p.pause(); b.btnPlayPause.setImageResource(R.drawable.ic_play) } else { p.play(); b.btnPlayPause.setImageResource(R.drawable.ic_pause) } } }
        b.btnRestart.setOnClickListener { player?.seekTo(0); player?.play() }
        // Step tracking
        viewLifecycleOwner.lifecycleScope.launch { while (isActive) {
            player?.let { p -> val sec = (p.currentPosition / 1000).toInt(); val idx = vm.getStepForTime(sec); if (idx != stepIdx) { stepIdx = idx; vm.setStep(idx); vm.selectedTutorial.value?.steps?.getOrNull(idx)?.let { b.tvCurrentStep.text = "Step \${idx+1}: \${it.title}" } }
                if (p.duration > 0) { b.seekBarVideo.progress = (p.currentPosition * 100 / p.duration).toInt(); b.tvTimeCurrent.text = fmt(p.currentPosition); b.tvTimeTotal.text = fmt(p.duration) } }
            delay(500)
        }}
        // Camera
        vm.startCamera()
        vm.camState.observe(viewLifecycleOwner) { st -> b.tvCameraStatus.text = when { st.isReady -> "LIVE \${st.resolution?.let { "\${it.first}x\${it.second}" } ?: ""}"; st.error != null -> "ERR: \${st.error}"; else -> "Connecting..." } }
        b.textureCamera.post { b.textureCamera.surfaceTexture?.let { vm.usb.startPreview(android.view.Surface(it)) } }
        b.btnStopCamera.setOnClickListener { vm.stopCamera() }
        // Tracking overlay
        vm.trackOutput.observe(viewLifecycleOwner) { o -> b.trackingOverlayView.setPos(o.x, o.y, o.zoom)
            val set = vm.settings.value; if (set?.autoZoomEnabled == true) { b.textureCamera.scaleX = o.zoom; b.textureCamera.scaleY = o.zoom; b.textureCamera.pivotX = b.textureCamera.width * o.x; b.textureCamera.pivotY = b.textureCamera.height * o.y }
            else { b.textureCamera.scaleX = 1f; b.textureCamera.scaleY = 1f } }
        vm.trackResult.observe(viewLifecycleOwner) { r -> b.trackingOverlayView.setResult(r); b.tvConfidence.text = "Conf: \${(r.confidence*100).toInt()}%" }
        vm.detections.observe(viewLifecycleOwner) { b.tvDetectionCount.text = "\$it detections" }
        vm.startTracking()
    }
    private fun fmt(ms: Long): String { val s = ms/1000; return String.format("%02d:%02d", s/60, s%60) }
    override fun onPause() { super.onPause(); player?.pause() }
    override fun onDestroyView() { super.onDestroyView(); player?.release(); player = null; vm.stopCamera(); vm.stopTracking(); _b = null }
}`);

addFile(kotlinSrc+"/ui/settings/SettingsFragment.kt", `package com.styleai.app.ui.settings
import android.os.Bundle; import android.view.*; import android.widget.SeekBar; import androidx.fragment.app.Fragment; import androidx.fragment.app.activityViewModels
import androidx.navigation.fragment.findNavController; import com.styleai.app.data.model.AppSettings; import com.styleai.app.databinding.FragmentSettingsBinding; import com.styleai.app.ui.main.MainViewModel

class SettingsFragment : Fragment() {
    private var _b: FragmentSettingsBinding? = null; private val b get() = _b!!; private val vm: MainViewModel by activityViewModels()
    override fun onCreateView(i: LayoutInflater, c: ViewGroup?, s: Bundle?): View { _b = FragmentSettingsBinding.inflate(i, c, false); return b.root }
    override fun onViewCreated(v: View, s: Bundle?) {
        super.onViewCreated(v, s); b.btnBack.setOnClickListener { findNavController().popBackStack() }
        vm.settings.observe(viewLifecycleOwner) { s ->
            b.switchTracking.isChecked = s.trackingEnabled; b.switchOverlay.isChecked = s.showOverlay; b.switchLandmarks.isChecked = s.showLandmarks
            b.switchAutoZoom.isChecked = s.autoZoomEnabled; b.switchMirror.isChecked = s.cameraMirror
            b.seekBarSmoothing.progress = (s.trackingSmoothing*100).toInt(); b.tvSmoothingValue.text = String.format("%.2f", s.trackingSmoothing)
            b.seekBarZoomSensitivity.progress = (s.zoomSensitivity*100).toInt(); b.tvZoomValue.text = String.format("%.2f", s.zoomSensitivity)
        }
        b.switchTracking.setOnCheckedChangeListener { _, c -> up { copy(trackingEnabled = c) } }
        b.switchOverlay.setOnCheckedChangeListener { _, c -> up { copy(showOverlay = c) } }
        b.switchLandmarks.setOnCheckedChangeListener { _, c -> up { copy(showLandmarks = c) } }
        b.switchAutoZoom.setOnCheckedChangeListener { _, c -> up { copy(autoZoomEnabled = c) } }
        b.switchMirror.setOnCheckedChangeListener { _, c -> up { copy(cameraMirror = c) } }
        b.seekBarSmoothing.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
            override fun onProgressChanged(sb: SeekBar?, p: Int, f: Boolean) { b.tvSmoothingValue.text = String.format("%.2f", p/100f); if (f) up { copy(trackingSmoothing = p/100f) } }
            override fun onStartTrackingTouch(sb: SeekBar?) {} override fun onStopTrackingTouch(sb: SeekBar?) {} })
        b.seekBarZoomSensitivity.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
            override fun onProgressChanged(sb: SeekBar?, p: Int, f: Boolean) { b.tvZoomValue.text = String.format("%.2f", p/100f); if (f) up { copy(zoomSensitivity = p/100f) } }
            override fun onStartTrackingTouch(sb: SeekBar?) {} override fun onStopTrackingTouch(sb: SeekBar?) {} })
        b.btnResetDefaults.setOnClickListener { vm.updateSettings(AppSettings()) }
    }
    private fun up(t: AppSettings.() -> AppSettings) { vm.updateSettings((vm.settings.value ?: AppSettings()).t()) }
    override fun onDestroyView() { super.onDestroyView(); _b = null }
}`);

addFile(kotlinSrc+"/ui/overlay/TrackingOverlayView.kt", `package com.styleai.app.ui.overlay
import android.content.Context; import android.graphics.*; import android.util.AttributeSet; import android.view.View
import com.styleai.app.data.model.*

class TrackingOverlayView @JvmOverloads constructor(ctx: Context, attrs: AttributeSet? = null) : View(ctx, attrs) {
    private var tx = 0.5f; private var ty = 0.5f; private var zoom = 1f
    private var result: TrackingResult? = null; private var enabled = false

    private val boxP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#8B5CF6"); style = Paint.Style.STROKE; strokeWidth = 4f }
    private val cornerP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#A78BFA"); style = Paint.Style.STROKE; strokeWidth = 6f }
    private val lmP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#10B981"); style = Paint.Style.FILL }
    private val chP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#F59E0B"); style = Paint.Style.STROKE; strokeWidth = 3f; pathEffect = DashPathEffect(floatArrayOf(10f, 8f), 0f) }
    private val txtP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; textSize = 32f; typeface = Typeface.DEFAULT_BOLD }
    private val bgP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.argb(180, 0, 0, 0) }
    private val dotP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#F59E0B"); style = Paint.Style.FILL }

    fun setPos(x: Float, y: Float, z: Float) { tx = x; ty = y; zoom = z; postInvalidate() }
    fun setResult(r: TrackingResult) { result = r; postInvalidate() }
    fun setEnabled(e: Boolean) { enabled = e; postInvalidate() }

    override fun onDraw(c: Canvas) {
        super.onDraw(c); if (!enabled) return
        val w = width.toFloat(); val h = height.toFloat()
        result?.face?.let { f ->
            val bx = f.x*w; val by = f.y*h; val bw = f.width*w; val bh = f.height*h
            boxP.style = Paint.Style.FILL; boxP.color = Color.argb(20, 139, 92, 246); c.drawRect(bx, by, bx+bw, by+bh, boxP)
            boxP.style = Paint.Style.STROKE; boxP.color = Color.parseColor("#8B5CF6"); c.drawRoundRect(bx, by, bx+bw, by+bh, 16f, 16f, boxP)
            val cl = minOf(40f, bw*0.2f, bh*0.2f)
            c.drawLine(bx,by+cl,bx,by,cornerP); c.drawLine(bx,by,bx+cl,by,cornerP)
            c.drawLine(bx+bw-cl,by,bx+bw,by,cornerP); c.drawLine(bx+bw,by,bx+bw,by+cl,cornerP)
            c.drawLine(bx,by+bh-cl,bx,by+bh,cornerP); c.drawLine(bx,by+bh,bx+cl,by+bh,cornerP)
            c.drawLine(bx+bw-cl,by+bh,bx+bw,by+bh,cornerP); c.drawLine(bx+bw,by+bh,bx+bw,by+bh-cl,cornerP)
            f.landmarks?.forEach { lm -> c.drawCircle(lm.x*w, lm.y*h, 6f, lmP) }
            val lbl = "Face \${(result!!.confidence*100).toInt()}%"; val lw = txtP.measureText(lbl)
            c.drawRoundRect(bx, by-48f, bx+lw+20f, by-8f, 8f, 8f, bgP); c.drawText(lbl, bx+10f, by-16f, txtP)
        }
        result?.body?.let { bd ->
            val bx = bd.x*w; val by = bd.y*h; val bw = bd.width*w; val bh = bd.height*h
            boxP.style = Paint.Style.STROKE; boxP.color = Color.parseColor("#10B981"); c.drawRoundRect(bx, by, bx+bw, by+bh, 16f, 16f, boxP)
        }
        val cx = tx*w; val cy = ty*h
        c.drawLine(cx-40f, cy, cx+40f, cy, chP); c.drawLine(cx, cy-40f, cx, cy+40f, chP); c.drawCircle(cx, cy, 8f, dotP)
        if (zoom > 1.05f) { val zl = String.format("%.1fx", zoom); val zw = txtP.measureText(zl); val zx = w-zw-30f
            c.drawRoundRect(zx, 16f, w-10f, 56f, 12f, 12f, bgP); txtP.color = Color.parseColor("#F59E0B"); c.drawText(zl, zx+10f, 46f, txtP); txtP.color = Color.WHITE }
    }
}`);

// BUILD ZIP
// ══════════════════════════════════════════════════════════════

async function buildZip() {
    const btn = document.getElementById('downloadBtn');
    const progress = document.getElementById('progress');
    const bar = document.getElementById('progressBar');
    const status = document.getElementById('status');

    btn.disabled = true;
    progress.classList.add('active');

    const zip = new JSZip();
    const entries = Object.entries(files);
    const total = entries.length;

    for (let i = 0; i < total; i++) {
        const [path, content] = entries[i];
        zip.file(path, content);
        bar.style.width = ((i + 1) / total * 100) + '%';
        status.textContent = `Adding: ${path}`;
        if (i % 5 === 0) await new Promise(r => setTimeout(r, 10));
    }

    status.textContent = 'Generating ZIP...';
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 9 } });

    saveAs(blob, 'StyleAI-Android-Kotlin.zip');
    status.textContent = `✅ Downloaded! ${total} files (${(blob.size / 1024).toFixed(0)} KB)`;
    btn.disabled = false;
}

// Show file tree
const tree = document.getElementById('tree');
let html = '<b>StyleAI/</b><br>';
const sorted = Object.keys(files).sort();
sorted.forEach(f => {
    const depth = f.split('/').length - 1;
    const indent = '  '.repeat(depth);
    const name = f.split('/').pop();
    const ext = name.split('.').pop();
    const cls = ext === 'kt' ? 'kotlin' : (ext === 'xml' ? 'xml' : '');
    html += `${indent}<span class="${cls}">${name}</span><br>`;
});
tree.innerHTML = html;
</script>
